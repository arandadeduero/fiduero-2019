name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Comprobar que la web publicada carga
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${URL%/}"
          # La hoja de estilos del tema lleva «?ver=» codificado en el nombre del fichero (así lo guardó wget)
          for intento in $(seq 1 18); do
            if curl -fsS "$base/" | grep -q "Fiduero 2019" \
              && curl -fsS "$base/actividades/" | grep -q "ACTIVIDADES" \
              && curl -fsS -o /dev/null "$base/wp-content/themes/arandaenfiestas/style.css%3Fver=17.4.css" \
              && curl -fsS -o /dev/null "$base/fonts/gf-1.css"; then
              echo "La web carga en $base"; exit 0
            fi
            echo "Intento $intento: todavía no responde, espero 10 s…"; sleep 10
          done
          echo "::error::La web no carga en $base"; exit 1
